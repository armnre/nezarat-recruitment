# Plesk → Domains → nezarat.shomal.ac.ir → Apache & nginx Settings
# → "Additional nginx directives". Document root = httpdocs (contents of dist-web).
# client_max_body_size must be >= MAX_UPLOAD_MB (default 10) + multipart overhead.

location ^~ /api/ {
    proxy_pass http://127.0.0.1:3102;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
    client_max_body_size 12m;
    add_header Cache-Control "no-store" always;
}

# Hashed Vite assets: cache for one year
location ^~ /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

# SPA fallback
location / {
    try_files $uri $uri/ /index.html;
}
